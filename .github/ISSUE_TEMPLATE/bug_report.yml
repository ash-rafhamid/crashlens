name: Bug report
description: Report reproducible behavior that is not working as expected
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve CrashLens. Remove credentials and private event data before submitting.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: How can we reproduce it?
      description: Include the smallest reliable sequence of steps.
      placeholder: |
        1. Start the services with ...
        2. Open ...
        3. Trigger ...
    validations:
      required: true
  - type: input
    id: component
    attributes:
      label: Affected component
      description: Browser SDK, API, dashboard, demo shop, database, or deployment
      placeholder: Dashboard
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include operating system, browser, Node.js version, and storage mode when relevant.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste a short redacted error or stack trace. Do not include API keys, passwords, cookies, or personal data.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: I removed credentials and private user data.
          required: true
